<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · TutorBoard</title>
</head>
<body>
  <main>
    <h1>Вход в TutorBoard</h1>
    <p>Используйте учётную запись преподавателя.</p>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <p><label>Email <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required></label></p>
      <p><label>Пароль <input type="password" name="password" autocomplete="current-password" required></label></p>
      <button type="submit">Продолжить</button>
    </form>
  </main>
</body>
</html>
