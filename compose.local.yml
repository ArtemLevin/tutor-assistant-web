name: ${COMPOSE_PROJECT_NAME:-tutorboard-local}

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

x-app-environment: &app-environment
  APP_ENV: development
  APP_SECRET_KEY: ${APP_SECRET_KEY:-local-only-secret-key-32-characters}
  APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
  AUTO_MIGRATE: "false"
  PUBLIC_BASE_URL: http://localhost:${LOCAL_PORT:-8080}
  TRUSTED_HOSTS: localhost,127.0.0.1
  TRUSTED_PROXY_IPS: 172.16.0.0/12
  SESSION_COOKIE_SECURE: "false"
  DATABASE_URL: postgresql+psycopg://tutor:${POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/tutor
  REDIS_URL: redis://redis:6379/0
  TASK_EAGER: "false"
  BBB_DEMO_MODE: "true"
  TRANSCRIPTION_PROVIDER: demo
  DOCUMENT_ENGINE_PROVIDER: local
  SEED_DEMO_DATA: "true"
  BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-TutorBoard Local}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Локальный администратор}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-local-demo-password}
  ARTIFACT_STORAGE_PROVIDER: s3
  ARTIFACT_S3_ENDPOINT_URL: http://minio:9000
  ARTIFACT_S3_REGION: us-east-1
  ARTIFACT_S3_BUCKET: tutor-artifacts
  ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tutor-local}
  ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password}
  ARTIFACT_CLAMAV_ENABLED: "true"
  GEOMETRYOS_BASE_URL: http://geometryos:8000
  METRICS_ENABLED: "false"
  LOG_JSON: "false"

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migration:
    condition: service_completed_successfully
  artifact-init:
    condition: service_completed_successfully
  clamav:
    condition: service_healthy
  geometryos:
    condition: service_healthy

services:
  gateway:
    image: caddy:2.10.0-alpine
    ports:
      - "${LOCAL_PORT:-8080}:8080"
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      tutorboard:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/health/live &&
          wget -q -O /dev/null http://127.0.0.1:8080/board/build.json
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 5s

  web:
    build:
      <<: *backend-build
      target: web
    environment: *app-environment
    command:
      - uvicorn
      - tutor_assistant_web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.16.0.0/12
      - --no-server-header
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 45s
    networks: [frontend, backend]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  tutorboard:
    build:
      context: ${TUTORBOARD_CONTEXT:-../tutorboard}
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: ${TUTORBOARD_BUILD_REVISION:-ad7c11d}
        BUILD_VERSION: ${TUTORBOARD_BUILD_VERSION:-1.0.0-rc.1}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  geometryos:
    build:
      context: ${GEOMETRYOS_CONTEXT:-../geometryos}
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: ${GEOMETRYOS_BUILD_REVISION:-84ae403}
        BUILD_VERSION: ${GEOMETRYOS_BUILD_VERSION:-0.3.0}
    environment:
      GEOMETRYOS_LOG_LEVEL: INFO
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  migration:
    build:
      <<: *backend-build
      target: migration
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  worker:
    build:
      <<: *backend-build
      target: worker
    environment: *app-environment
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 90s
    networks: [backend]

  scheduler:
    build:
      <<: *backend-build
      target: scheduler
    environment: *app-environment
    depends_on: *app-depends
    restart: unless-stopped
    stop_grace_period: 45s
    networks: [backend]

  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: tutor
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - local-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tutor-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    volumes:
      - local-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/tutor-artifacts &&
        mc anonymous set none local/tutor-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tutor-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  artifact-init:
    build:
      <<: *backend-build
      target: ops
    command: ["tutor-assistant-artifacts", "configure-bucket"]
    environment: *app-environment
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [backend]

  clamav:
    image: clamav/clamav:1.4.3
    volumes:
      - local-clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks: [backend]

  smoke:
    build:
      <<: *backend-build
      target: ops
    command: ["python", "/smoke/smoke.py"]
    environment:
      LOCAL_BASE_URL: http://gateway:8080
      LOCAL_PUBLIC_ORIGIN: http://localhost:${LOCAL_PORT:-8080}
      LOCAL_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
      LOCAL_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-local-demo-password}
    volumes:
      - ./deploy/local/smoke.py:/smoke/smoke.py:ro
      - ./schemas/board/v1/fixtures:/smoke/board-fixtures:ro
    depends_on:
      gateway:
        condition: service_healthy
    profiles: [smoke]
    networks: [frontend]

networks:
  frontend:
    internal: true
  backend:
    internal: true

volumes:
  local-postgres-data:
  local-redis-data:
  local-minio-data:
  local-clamav-data:
