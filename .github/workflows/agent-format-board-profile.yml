name: Agent format board profile

on:
  push:
    branches:
      - agent/board-only-production-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/board-only-production-profile
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format new board-profile sources
        run: >-
          uv run ruff format
          src/tutor_assistant_web/bootstrap/board_app_factory.py
          src/tutor_assistant_web/modules/boards/standalone_access.py
          src/tutor_assistant_web/modules/boards/standalone_routes.py
      - name: Remove one-shot workflow and push formatter result
        run: |
          git rm .github/workflows/agent-format-board-profile.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: format board production profile'
          git push origin HEAD:agent/board-only-production-profile
