name: B2 foundation patch

on:
  push:
    branches:
      - agent/b2-guest-invitations

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b2-guest-invitations
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply foundation patch
        run: |
          python tools/b2_foundation_patch.py
          uvx ruff format src/tutor_assistant_web/modules/boards/models.py src/tutor_assistant_web/modules/boards/standalone_contracts.py src/tutor_assistant_web/config.py src/tutor_assistant_web/bootstrap/container.py src/tutor_assistant_web/modules/boards/application.py src/tutor_assistant_web/modules/boards/access.py src/tutor_assistant_web/modules/boards/guest_access.py src/tutor_assistant_web/migrations/versions/0016_board_guest_invites.py
          rm tools/b2_foundation_patch.py .github/workflows/b2-foundation-patch.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: wire B2 guest access foundation'
          git push origin HEAD:agent/b2-guest-invitations
