name: Vendor input UX contract

on:
  push:
    branches: [feat/input-ux-contract-compat]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/input-ux-contract-compat
          path: tutor-assistant-web
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ArtemLevin/tutorboard
          ref: c6433224d264215ccd6bfb43b332e5ed5380aaf9
          path: tutorboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
        working-directory: tutor-assistant-web
      - name: Vendor exact frontend contract
        run: uv run python scripts/vendor_board_contract.py --source-root ../tutorboard
        working-directory: tutor-assistant-web
      - name: Regenerate Pydantic DTOs
        run: uv run python scripts/generate_board_contract_models.py
        working-directory: tutor-assistant-web
      - name: Commit vendored contract and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vendor-input-ux-contract.yml
          git add schemas src/tutor_assistant_web/shared/board_contracts
          git commit -m "chore: vendor input UX board contract"
          git push origin HEAD:feat/input-ux-contract-compat
        working-directory: tutor-assistant-web
