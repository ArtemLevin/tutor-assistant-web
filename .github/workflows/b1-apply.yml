name: B1 apply

on:
  push:
    branches:
      - agent/b1-standalone-persistence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b1-standalone-persistence
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply B1 source transformations
        run: python scripts/b1_apply.py
      - name: Install locked development dependencies
        run: uv sync --extra dev
      - name: Format changed sources
        run: uv run ruff format src/tutor_assistant_web/modules/boards src/tutor_assistant_web/migrations/versions/0015_standalone_board_persistence.py
      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant_web/modules/boards src/tutor_assistant_web/migrations/versions/0015_standalone_board_persistence.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: implement standalone board persistence model"
          git push origin HEAD:agent/b1-standalone-persistence
