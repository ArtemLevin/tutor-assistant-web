name: Finalize ordered local stack smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-smoke:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TUTORBOARD_CONTEXT: ${{ github.workspace }}/integrations/tutorboard
      GEOMETRYOS_CONTEXT: ${{ github.workspace }}/integrations/geometryos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ArtemLevin/tutorboard
          ref: release/tutorboard-stack-v1.0.0-rc.1
          path: integrations/tutorboard
      - uses: actions/checkout@v4
        with:
          repository: ArtemLevin/geometryos
          ref: release/tutorboard-stack-v1.0.0-rc.1
          path: integrations/geometryos
      - run: python scripts/finalize_local_stack_v13.py
      - run: docker compose --env-file deploy/local/.env.local.example -f compose.local.yml config --quiet
      - name: Build and start healthy local stack
        run: |
          docker compose --env-file deploy/local/.env.local.example -f compose.local.yml up --build --detach --wait --wait-timeout 180 > /tmp/local-stack-up.log 2>&1
      - name: Run unified smoke
        run: |
          set +e
          docker compose --env-file deploy/local/.env.local.example -f compose.local.yml --profile smoke run --rm smoke > /tmp/unified-smoke.log 2>&1
          smoke_status=$?
          echo "smoke_status=${smoke_status}"
          echo "--- smoke output ---"
          tail -n 160 /tmp/unified-smoke.log
          if [ "${smoke_status}" -ne 0 ]; then
            exit 1
          fi
      - name: Commit implementation
        run: |
          docker compose --env-file deploy/local/.env.local.example -f compose.local.yml down --volumes --remove-orphans
          rm -rf integrations .github/workflows/automation-local-stack-v13.yml scripts/finalize_local_stack_v13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(local): gate gateway readiness on TutorBoard"
          git push origin HEAD:feature/p0-ordered-envelope-v13
      - name: Logs on failure
        if: failure()
        run: |
          echo "--- compose ps ---"
          docker compose --env-file deploy/local/.env.local.example -f compose.local.yml ps || true
          echo "--- unified smoke ---"
          tail -n 160 /tmp/unified-smoke.log 2>/dev/null || true
          echo "--- gateway tail ---"
          docker compose --env-file deploy/local/.env.local.example -f compose.local.yml logs --no-color --tail 40 gateway || true
          echo "--- web tail ---"
          docker compose --env-file deploy/local/.env.local.example -f compose.local.yml logs --no-color --tail 40 web || true
      - name: Cleanup
        if: always()
        run: docker compose --env-file deploy/local/.env.local.example -f compose.local.yml down --volumes --remove-orphans > /dev/null 2>&1 || true
