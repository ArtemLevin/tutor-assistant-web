name: Sync Board contract v1.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-contract:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ArtemLevin/tutorboard
          ref: feature/p0-ordered-envelope-v13
          path: .contract-source/tutorboard
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install generation toolchain
        run: uv sync --extra dev
      - name: Import verified Board v1.3 artifacts
        run: |
          rm -rf schemas/board/v1
          mkdir -p schemas/board/v1
          cp -R .contract-source/tutorboard/contracts/board/v1/. schemas/board/v1/
          uv run python scripts/generate_board_contract_models.py
      - name: Remove temporary sources and workflow
        run: rm -rf .contract-source .github/workflows/automation-sync-board-v13.yml
      - name: Commit synchronized contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(boards): consume ordered Board envelope v1.3"
          git push origin HEAD:feature/p0-ordered-envelope-v13
      - name: Verify generated contract
        run: make board-contract-check
