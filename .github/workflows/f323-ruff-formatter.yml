name: Temporary F3.2.3 backend formatter
on:
  push:
    branches:
      - fix/f3-2-3-media-restore-gate
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Emit formatted backend artifacts
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            src/tutor_assistant_web/backup_operations.py
            tests/test_board_media_postgres_minio.py
            tests/test_board_media_restore.py
          )
          uv run ruff format "${paths[@]}"
          for path in "${paths[@]}"; do
            echo "F323_FILE:${path}:$(base64 -w0 "$path")"
          done
