name: Temporary urllib3 lock diff

on:
  push:
    branches: [codex/board-media-authority-m1-m2]

permissions:
  contents: read

jobs:
  lock-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade urllib3 lock entry
        run: |
          uv lock --upgrade-package urllib3
          git diff -- uv.lock
