name: Temporary board contract vendor

on:
  push:
    branches:
      - agent/media-m1-contract-compat

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@v4
      - name: Check out TutorBoard contract source
        uses: actions/checkout@v4
        with:
          repository: ArtemLevin/tutorboard
          ref: 26a947016dc5fbb6017a144ccbddd8c3e32d575f
          path: integrations/tutorboard-contract
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python scripts/vendor_board_contract.py --source-root integrations/tutorboard-contract
      - run: make board-contract-generate
      - name: Commit vendored contract and generated DTOs
        run: |
          rm .github/workflows/tmp-vendor-board-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/board src/tutor_assistant_web/shared/board_contracts .github/workflows/tmp-vendor-board-contract.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: vendor TutorBoard media contract"
          git push origin HEAD:agent/media-m1-contract-compat
