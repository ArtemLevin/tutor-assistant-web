name: Temporary F3.2 Ruff formatter
on:
  push:
    branches:
      - fix/f3-2-media-upload-reliability
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Print Ruff-formatted integration test
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/test_board_media_postgres_minio.py
          echo "F32_RUFF_BASE64:$(base64 -w0 tests/test_board_media_postgres_minio.py)"
