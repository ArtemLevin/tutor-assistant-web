name: B2 format contract test

on:
  push:
    branches:
      - agent/b2-guest-invitations

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b2-guest-invitations
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: |
          uvx ruff format tests/test_standalone_board_b2_contract.py
          rm .github/workflows/b2-format-contract-test.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'style: format B2 contract regression test'
          git push origin HEAD:agent/b2-guest-invitations
