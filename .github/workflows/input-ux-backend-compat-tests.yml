name: Input UX backend compat tests

on:
  push:
    branches: [feat/input-ux-contract-compat]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/input-ux-contract-compat
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/generate_board_contract_models.py --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q tests/test_board_contracts.py tests/test_board_api.py tests/test_board_persistence.py tests/test_board_collaboration.py
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/input-ux-backend-compat-tests.yml
          git commit -m "chore: remove temporary input UX compatibility gate"
          git push origin HEAD:feat/input-ux-contract-compat
