name: B1 format test

on:
  push:
    branches:
      - agent/b1-standalone-persistence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b1-standalone-persistence
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff format tests/test_standalone_board_b1.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_standalone_board_b1.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format B1 regression test"
          git push origin HEAD:agent/b1-standalone-persistence
