name: B1 lint fix

on:
  push:
    branches:
      - agent/b1-standalone-persistence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b1-standalone-persistence
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check --fix src/tutor_assistant_web/modules/boards/application.py
      - run: uv run ruff format src/tutor_assistant_web/modules/boards/application.py
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant_web/modules/boards/application.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: organize B1 board service imports"
          git push origin HEAD:agent/b1-standalone-persistence
