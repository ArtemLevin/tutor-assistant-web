name: Temporary export typography board contract artifacts
on:
  pull_request:
jobs:
  generate-artifacts:
    if: github.head_ref == 'feat/board-optional-text-typography-20261018'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ArtemLevin/tutorboard
          ref: 3dc6b4c11ca8f5292240f341c3760a44c0cc9a86
          path: integrations/tutorboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run python scripts/vendor_board_contract.py --source-root integrations/tutorboard
      - run: uv run python scripts/generate_board_contract_models.py
      - name: Export generated artifacts
        run: |
          for f in schemas/board/v1/board-document.schema.json schemas/board/v1/board-command-envelope.schema.json schemas/board/v1/board-snapshot.schema.json schemas/board/v1/manifest.json schemas/board/source.json src/tutor_assistant_web/shared/board_contracts/board_document_schema.py src/tutor_assistant_web/shared/board_contracts/board_command_envelope_schema.py src/tutor_assistant_web/shared/board_contracts/board_snapshot_schema.py; do
            printf 'BOARDGEN:%s:' "$f"
            base64 -w0 "$f"
            printf '\n'
          done
