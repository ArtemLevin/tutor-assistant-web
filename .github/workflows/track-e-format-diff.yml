name: Track E format apply
on:
  push:
    branches: [agent/track-e-retention-analytics]
permissions:
  contents: write
jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Apply Ruff formatter
        run: |
          uv run ruff format src/tutor_assistant_web/migrations/versions/0018_practice_analytics_metadata.py src/tutor_assistant_web/modules/practice/analytics.py src/tutor_assistant_web/modules/practice/retention.py tests/test_practice_analytics.py
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tutor_assistant_web/migrations/versions/0018_practice_analytics_metadata.py src/tutor_assistant_web/modules/practice/analytics.py src/tutor_assistant_web/modules/practice/retention.py tests/test_practice_analytics.py
          git commit -m "style: apply Ruff formatter to Track E"
          git push
