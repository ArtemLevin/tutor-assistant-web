name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-production-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate POSIX shell scripts
        run: |
          shellcheck --severity=warning deploy/ubuntu/*.sh
          shellcheck --severity=warning deploy/yandex-cloud/scripts/*.sh
          for script in \
            deploy/production/*.sh \
            deploy/ubuntu/*.sh \
            deploy/yandex-cloud/scripts/*.sh; do
            sh -n "$script"
          done
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false
      - name: Validate Yandex Cloud Terraform
        working-directory: deploy/yandex-cloud/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Validate Yandex Cloud Ansible
        run: |
          python3 -m pip install 'ansible-core>=2.16,<3'
          ansible-playbook \
            --syntax-check \
            -i deploy/yandex-cloud/ansible/inventory.example.yml \
            -e @deploy/yandex-cloud/ansible/vars.example.yml \
            deploy/yandex-cloud/ansible/playbook.yml
      - name: Reject CRLF in Linux deployment files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              *Path("deploy").rglob("*.sh"),
              *Path("deploy").rglob("*.service"),
              *Path(".github").rglob("*.yml"),
          ]
          invalid = [str(path) for path in paths if b"\r\n" in path.read_bytes()]
          if invalid:
              raise SystemExit("CRLF found in Linux files: " + ", ".join(invalid))
          PY
      - name: Validate systemd units
        run: |
          cat > /tmp/docker.service <<'EOF'
          [Unit]
          Description=CI Docker service placeholder
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          EOF
          sed \
            -e "s|@INSTALL_DIR@|$GITHUB_WORKSPACE|g" \
            -e "s|@DEPLOY_USER@|$USER|g" \
            deploy/ubuntu/tutorboard-stack.service \
            > /tmp/tutorboard-stack.service
          sed \
            -e "s|@INSTALL_DIR@|$GITHUB_WORKSPACE|g" \
            -e "s|@DEPLOY_USER@|$USER|g" \
            deploy/ubuntu/tutorboard-firewall.service \
            > /tmp/tutorboard-firewall.service
          systemd-analyze verify \
            /tmp/docker.service \
            /tmp/tutorboard-firewall.service \
            /tmp/tutorboard-stack.service

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run bandit -r src -ll
      - run: uv export --quiet --frozen --no-hashes --no-dev --no-emit-project --output-file /tmp/requirements-audit.txt
      - run: uv run pip-audit --strict --requirement /tmp/requirements-audit.txt
      - name: Validate unified local Compose rendering
        run: >-
          docker compose
          --env-file deploy/local/.env.local.example
          -f compose.local.yml
          config --quiet
      - run: uv run pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutor_test
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://tutor:tutor@127.0.0.1:5432/tutor_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: minioadmin
      TEST_S3_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          docker run -d --name minio -p 9000:9000
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - run: uv sync --extra dev
      - run: uv run pytest tests/test_postgres_integration.py tests/test_redis_integration.py tests/test_minio_integration.py

  collaboration-e2e:
    name: Two-client board collaboration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out backend
        uses: actions/checkout@v4
      - name: Read pinned TutorBoard commit
        id: tutorboard-contract
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          source = json.loads(Path("schemas/board/source.json").read_text())
          print(f"ref={source['sourceCommit']}")
          PY
      - name: Check out contract-matched TutorBoard
        uses: actions/checkout@v4
        with:
          repository: ArtemLevin/tutorboard
          ref: ${{ steps.tutorboard-contract.outputs.ref }}
          path: integrations/tutorboard
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version-file: integrations/tutorboard/.nvmrc
          cache: npm
          cache-dependency-path: integrations/tutorboard/package-lock.json
      - name: Install locked backend dependencies
        run: uv sync --extra dev
      - name: Install locked TutorBoard dependencies
        working-directory: integrations/tutorboard
        run: npm ci
      - name: Install Chromium
        working-directory: integrations/tutorboard
        run: npx playwright install --with-deps chromium
      - name: Run real tutor/student collaboration scenario
        working-directory: integrations/tutorboard
        env:
          TUTOR_ASSISTANT_WEB_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          npm run e2e:collaboration 2>&1 | tee collaboration-e2e.log
      - name: Upload collaboration failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collaboration-e2e-failure-${{ github.sha }}
          path: |
            integrations/tutorboard/collaboration-e2e.log
            integrations/tutorboard/test-results
          if-no-files-found: warn
          retention-days: 7

  unified-local-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ArtemLevin/tutorboard
          ref: release/tutorboard-stack-v1.0.0-rc.1
          path: integrations/tutorboard
      - uses: actions/checkout@v4
        with:
          repository: ArtemLevin/geometryos
          ref: release/tutorboard-stack-v1.0.0-rc.1
          path: integrations/geometryos
      - name: Build and start unified application
        env:
          TUTORBOARD_CONTEXT: ${{ github.workspace }}/integrations/tutorboard
          GEOMETRYOS_CONTEXT: ${{ github.workspace }}/integrations/geometryos
        run: >-
          docker compose
          --env-file deploy/local/.env.local.example
          -f compose.local.yml
          up --build --detach
      - name: Run vertical smoke
        env:
          TUTORBOARD_CONTEXT: ${{ github.workspace }}/integrations/tutorboard
          GEOMETRYOS_CONTEXT: ${{ github.workspace }}/integrations/geometryos
        run: >-
          docker compose
          --env-file deploy/local/.env.local.example
          -f compose.local.yml
          --profile smoke
          run --rm smoke
      - name: Collect unified stack logs
        if: failure()
        env:
          TUTORBOARD_CONTEXT: ${{ github.workspace }}/integrations/tutorboard
          GEOMETRYOS_CONTEXT: ${{ github.workspace }}/integrations/geometryos
        run: >-
          docker compose
          --env-file deploy/local/.env.local.example
          -f compose.local.yml
          logs --no-color --tail 200
          gateway web tutorboard geometryos migration worker scheduler
      - name: Stop unified application
        if: always()
        env:
          TUTORBOARD_CONTEXT: ${{ github.workspace }}/integrations/tutorboard
          GEOMETRYOS_CONTEXT: ${{ github.workspace }}/integrations/geometryos
        run: >-
          docker compose
          --env-file deploy/local/.env.local.example
          -f compose.local.yml
          down --volumes --remove-orphans
