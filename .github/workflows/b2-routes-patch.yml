name: B2 routes patch

on:
  push:
    branches:
      - agent/b2-guest-invitations

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b2-guest-invitations
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply route patch
        run: |
          python tools/b2_routes_patch.py
          uvx ruff format src/tutor_assistant_web/modules/boards/routes.py
          rm tools/b2_routes_patch.py .github/workflows/b2-routes-patch.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: implement standalone guest invitation routes'
          git push origin HEAD:agent/b2-guest-invitations
