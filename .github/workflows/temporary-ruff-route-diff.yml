name: Temporary Ruff route diff

on:
  push:
    branches: [codex/board-media-authority-m1-m2]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Show Ruff route diff
        run: uv run ruff format --diff src/tutor_assistant_web/modules/boards/routes.py
