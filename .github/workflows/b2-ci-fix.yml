name: B2 CI fix

on:
  push:
    branches:
      - agent/b2-guest-invitations

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b2-guest-invitations
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply fixes and format B2 files
        run: |
          python tools/b2_ci_fix.py
          uvx ruff format tests/test_standalone_board_b2.py src/tutor_assistant_web/modules/boards/guest_access.py src/tutor_assistant_web/modules/boards/routes.py
          rm tools/b2_ci_fix.py .github/workflows/b2-ci-fix.yml
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: harden B2 expiry handling and CI formatting'
          git push origin HEAD:agent/b2-guest-invitations
