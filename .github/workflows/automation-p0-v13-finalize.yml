name: Finalize Board envelope v1.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run python scripts/finalize_board_v13.py
      - name: Refresh generated DTO references
        run: |
          sed -i \
            -e 's/BoardDocument10/BoardDocument11/g' \
            -e 's/BoardSnapshot10/BoardSnapshot11/g' \
            -e 's/BoardGeometryImport10/BoardGeometryImport11/g' \
            tests/test_board_contracts.py
      - run: uv run ruff format src/tutor_assistant_web/modules/boards tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - run: uv run ruff check --fix src/tutor_assistant_web/modules/boards tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - run: uv run ruff check src/tutor_assistant_web/modules/boards tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - run: make board-contract-check
      - run: uv run pytest tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - name: Commit implementation
        run: |
          rm -f .github/workflows/automation-p0-v13-finalize.yml scripts/finalize_board_v13.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(boards): finalize ordered envelope persistence"
          git push origin HEAD:feature/p0-ordered-envelope-v13
