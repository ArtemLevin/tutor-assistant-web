name: Finalize Board envelope v1.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.event.pull_request.head.ref == 'feature/p0-ordered-envelope-v13'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p0-ordered-envelope-v13
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Finalize compatibility, persistence and API behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"marker missing in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          models = "src/tutor_assistant_web/modules/boards/models.py"
          replace(
              models,
              '''        CheckConstraint("lamport_min >= 0", name="ck_board_commands_lamport_min"),
          CheckConstraint(
              "lamport_max >= lamport_min",
              name="ck_board_commands_lamport_range",
          ),''',
              '''        CheckConstraint(
              "(lamport_min IS NULL AND lamport_max IS NULL) OR "
              "(lamport_min IS NOT NULL AND lamport_max IS NOT NULL)",
              name="ck_board_commands_lamport_pair",
          ),
          CheckConstraint(
              "lamport_min IS NULL OR (lamport_min > 0 AND lamport_max >= lamport_min)",
              name="ck_board_commands_lamport_range",
          ),''',
          )
          replace(
              models,
              '''    lamport_min: Mapped[int] = mapped_column(Integer, default=0)
          lamport_max: Mapped[int] = mapped_column(Integer, default=0)''',
              '''    lamport_min: Mapped[int | None] = mapped_column(Integer, nullable=True)
          lamport_max: Mapped[int | None] = mapped_column(Integer, nullable=True)''',
          )

          application = "src/tutor_assistant_web/modules/boards/application.py"
          replace(application, "import json\n", "import json\nimport logging\n")
          replace(
              application,
              '''_IDENTIFIER = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$")
          _UNSAFE_IDENTIFIERS = {"__proto__", "constructor", "prototype"}''',
              '''_IDENTIFIER = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$")
          _UNSAFE_IDENTIFIERS = {"__proto__", "constructor", "prototype"}
          _LOGGER = logging.getLogger(__name__)''',
          )
          replace(
              application,
              '''class BoardRevisionConflict(ConflictError):
              def __init__(self, expected_revision: int, current_revision: int) -> None:
                  super().__init__(
                      f"Версия доски устарела: ожидалась {expected_revision}, "
                      f"текущая версия {current_revision}"
                  )
                  self.expected_revision = expected_revision
                  self.current_revision = current_revision


          @dataclass(frozen=True)''',
              '''class BoardRevisionConflict(ConflictError):
              def __init__(self, expected_revision: int, current_revision: int) -> None:
                  super().__init__(
                      f"Версия доски устарела: ожидалась {expected_revision}, "
                      f"текущая версия {current_revision}"
                  )
                  self.expected_revision = expected_revision
                  self.current_revision = current_revision


          class BoardLamportConflict(ConflictError):
              def __init__(
                  self,
                  actor_id: str,
                  previous_lamport: int,
                  incoming_lamport: int,
              ) -> None:
                  super().__init__("Lamport пакета должен возрастать для actor доски")
                  self.actor_id = actor_id
                  self.previous_lamport = previous_lamport
                  self.incoming_lamport = incoming_lamport


          @dataclass(frozen=True)''',
          )
          replace(
              application,
              '''        try:
                  lamport_min, lamport_max = envelope_lamport_range(envelope)
              except ValueError as exc:
                  raise ValidationError(str(exc)) from exc''',
              '''        try:
                  lamport_range = envelope_lamport_range(envelope)
              except ValueError as exc:
                  raise ValidationError(str(exc)) from exc
              if lamport_range is None:
                  lamport_min = None
                  lamport_max = None
              else:
                  lamport_min, lamport_max = lamport_range''',
          )
          replace(application, "            if lamport_min > 0:\n", "            if lamport_min is not None:\n")
          replace(
              application,
              '''                if lamport_min <= latest_lamport:
                      raise ConflictError("Lamport пакета должен возрастать для actor доски")''',
              '''                if lamport_min <= latest_lamport:
                      raise BoardLamportConflict(
                          contract_actor_id,
                          latest_lamport,
                          lamport_min,
                      )''',
          )
          replace(
              application,
              '''            session.add(batch)
              session.commit()
              return batch''',
              '''            session.add(batch)
              session.commit()
              _LOGGER.info(
                  "Board command batch committed",
                  extra={
                      "event": "board.command_batch.committed",
                      "document_id": document.id,
                      "actor_id": contract_actor_id,
                      "schema_version": envelope.schema_version,
                      "base_revision": envelope.base_revision,
                      "revision": revision,
                      "lamport_min": lamport_min,
                      "lamport_max": lamport_max,
                      "command_count": len(envelope.commands),
                      "payload_sha256": payload_sha256,
                  },
              )
              return batch''',
          )

          routes = "src/tutor_assistant_web/modules/boards/routes.py"
          replace(
              routes,
              '''from tutor_assistant_web.modules.boards.application import (
              BoardPersistenceService,
              BoardRevisionConflict,
              canonical_json,
          )''',
              '''from tutor_assistant_web.modules.boards.application import (
              BoardLamportConflict,
              BoardPersistenceService,
              BoardRevisionConflict,
              canonical_json,
          )''',
          )
          replace(
              routes,
              '''        envelope = envelope_input.root
              if envelope.document_id.root != document_id:''',
              '''        envelope = envelope_input.root
              BOARD_SYNC_EVENTS.labels(event=f"envelope_{envelope.schema_version}_received").inc()
              if envelope.document_id.root != document_id:''',
          )
          replace(
              routes,
              '''        try:
                  batch = boards.append_commands(envelope, actor.user_id)
              except BoardRevisionConflict as exc:''',
              '''        try:
                  batch = boards.append_commands(envelope, actor.user_id)
              except BoardLamportConflict as exc:
                  BOARD_SYNC_EVENTS.labels(event="lamport_conflict").inc()
                  return JSONResponse(
                      {
                          "error": {
                              "code": "board_lamport_conflict",
                              "message": str(exc),
                              "actorId": exc.actor_id,
                              "previousLamport": exc.previous_lamport,
                              "incomingLamport": exc.incoming_lamport,
                          }
                      },
                      status_code=409,
                      headers={"ETag": _etag(previous_revision)},
                  )
              except BoardRevisionConflict as exc:''',
          )
          replace(
              routes,
              '''                    "command_count": len(envelope.commands),''',
              '''                    "command_count": len(envelope_commands(envelope)),''',
          )
          replace(
              routes,
              '''            container.collaboration.publish(
                  actor.organization_id,
                  document.id,
                  {
                      "type": "board.revision",
                      "protocolVersion": "1.0",
                      "documentId": document.id,
                      "revision": batch.revision,
                      "baseRevision": batch.base_revision,
                      "idempotencyKey": batch.idempotency_key,
                      "actorId": actor.user_id,
                  },
              )
          return JSONResponse(''',
              '''            container.collaboration.publish(
                  actor.organization_id,
                  document.id,
                  {
                      "type": "board.revision",
                      "protocolVersion": "1.0",
                      "documentId": document.id,
                      "revision": batch.revision,
                      "baseRevision": batch.base_revision,
                      "idempotencyKey": batch.idempotency_key,
                      "actorId": actor.user_id,
                  },
              )
          else:
              BOARD_SYNC_EVENTS.labels(event="idempotent_retry").inc()
          return JSONResponse(''',
          )
          replace(
              routes,
              '''        "actorUserId": batch.actor_user_id,
              "payloadSha256": batch.payload_sha256,''',
              '''        "actorUserId": batch.actor_user_id,
              "schemaVersion": batch.schema_version,
              "lamportMin": batch.lamport_min,
              "lamportMax": batch.lamport_max,
              "payloadSha256": batch.payload_sha256,''',
          )

          tests = "tests/test_board_api.py"
          replace(
              tests,
              '''from tutor_assistant_web.modules.boards.evidence import _utc_milliseconds''',
              '''from tutor_assistant_web.modules.boards.evidence import _utc_milliseconds
          from tutor_assistant_web.modules.boards.models import BoardCommandBatch''',
          )
          replace(
              tests,
              '''def _command_payload(user_id: str, *, base_revision: int = 0, key: str = "api:batch-1"):
              payload = json.loads((FIXTURES / "board-command-envelope.json").read_text())
              payload.update(
                  {
                      "documentId": DOCUMENT_ID,
                      "baseRevision": base_revision,
                      "idempotencyKey": key,
                      "actorId": user_id,
                  }
              )
              for command in payload["commands"]:
                  command["actorId"] = user_id
              return payload''',
              '''def _command_payload(
              user_id: str,
              *,
              base_revision: int = 0,
              key: str = "api:batch-1",
              lamport_start: int = 1,
          ):
              payload = json.loads((FIXTURES / "board-command-envelope.json").read_text())
              payload.update(
                  {
                      "documentId": DOCUMENT_ID,
                      "baseRevision": base_revision,
                      "idempotencyKey": key,
                      "actorId": user_id,
                  }
              )
              for index, item in enumerate(payload["commands"]):
                  command = item.get("command", item)
                  command["actorId"] = user_id
                  order = item.get("order")
                  if order is not None:
                      order["baseRevisionAtCreation"] = base_revision
                      order["lamport"] = lamport_start + index
              return payload


          def _legacy_command_payload(
              user_id: str,
              *,
              base_revision: int = 0,
              key: str = "api:legacy-batch",
          ):
              payload = _command_payload(
                  user_id,
                  base_revision=base_revision,
                  key=key,
              )
              payload["schemaVersion"] = "1.2"
              payload["commands"] = [item["command"] for item in payload["commands"]]
              return payload''',
          )

          api_tests = Path(tests)
          text = api_tests.read_text(encoding="utf-8")
          marker = "\ndef test_actor_id_is_bound_to_authenticated_user(board_api):\n"
          if marker not in text:
              raise SystemExit("board API insertion marker missing")
          additions = r'''

          def test_ordered_lamport_range_is_persisted_and_replay_is_rejected(board_api):
              client, database, _, _, _, context = board_api
              csrf = context["csrfToken"]
              user_id = context["userId"]
              expected_sha = _snapshot_payload()["documentSha256"]

              first = _command_payload(user_id, lamport_start=1)
              first["expectedDocumentSha256"] = expected_sha
              response = client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=first,
                  headers={"x-csrf-token": csrf},
              )
              assert response.status_code == 200

              with database.sessions() as session:
                  stored = session.scalar(
                      select(BoardCommandBatch).where(
                          BoardCommandBatch.board_document_id == DOCUMENT_ID,
                          BoardCommandBatch.revision == 1,
                      )
                  )
                  assert stored is not None
                  assert (stored.lamport_min, stored.lamport_max) == (1, 2)

              replay = _command_payload(
                  user_id,
                  base_revision=1,
                  key="api:batch-lamport-replay",
                  lamport_start=2,
              )
              replay["expectedDocumentSha256"] = expected_sha
              rejected = client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=replay,
                  headers={"x-csrf-token": csrf},
              )
              assert rejected.status_code == 409
              assert rejected.json()["error"] == {
                  "code": "board_lamport_conflict",
                  "message": "Lamport пакета должен возрастать для actor доски",
                  "actorId": user_id,
                  "previousLamport": 2,
                  "incomingLamport": 2,
              }


          def test_mixed_legacy_and_ordered_journal_remains_recoverable(board_api):
              client, database, _, _, _, context = board_api
              csrf = context["csrfToken"]
              user_id = context["userId"]
              expected_sha = _snapshot_payload()["documentSha256"]

              legacy = _legacy_command_payload(user_id)
              legacy["expectedDocumentSha256"] = expected_sha
              assert client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=legacy,
                  headers={"x-csrf-token": csrf},
              ).status_code == 200

              ordered = _command_payload(
                  user_id,
                  base_revision=1,
                  key="api:ordered-after-legacy",
                  lamport_start=1,
              )
              ordered["expectedDocumentSha256"] = expected_sha
              assert client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=ordered,
                  headers={"x-csrf-token": csrf},
              ).status_code == 200

              recovered = client.get(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  params={"afterRevision": 0},
              )
              assert recovered.status_code == 200
              items = recovered.json()["items"]
              assert [item["revision"] for item in items] == [1, 2]
              assert [item["schemaVersion"] for item in items] == ["1.2", "1.3"]
              assert items[0]["lamportMin"] is None
              assert items[1]["lamportMin"] == 1

              with database.sessions() as session:
                  batches = list(
                      session.scalars(
                          select(BoardCommandBatch)
                          .where(BoardCommandBatch.board_document_id == DOCUMENT_ID)
                          .order_by(BoardCommandBatch.revision)
                      )
                  )
              assert batches[0].lamport_min is None
              assert batches[0].lamport_max is None
              assert (batches[1].lamport_min, batches[1].lamport_max) == (1, 2)


          def test_client_clock_skew_does_not_control_command_acceptance(board_api):
              client, _, _, _, _, context = board_api
              csrf = context["csrfToken"]
              user_id = context["userId"]
              expected_sha = _snapshot_payload()["documentSha256"]

              past = _command_payload(user_id, lamport_start=1)
              for item in past["commands"]:
                  item["command"]["timestamp"] = "2000-01-01T00:00:00.000Z"
              past["expectedDocumentSha256"] = expected_sha
              assert client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=past,
                  headers={"x-csrf-token": csrf},
              ).status_code == 200

              future = _command_payload(
                  user_id,
                  base_revision=1,
                  key="api:future-clock",
                  lamport_start=3,
              )
              for item in future["commands"]:
                  item["command"]["timestamp"] = "2099-01-01T00:00:00.000Z"
              future["expectedDocumentSha256"] = expected_sha
              response = client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=future,
                  headers={"x-csrf-token": csrf},
              )
              assert response.status_code == 200
              assert response.json()["revision"] == 2


          def test_idempotency_key_rejects_a_different_payload(board_api):
              client, _, _, _, _, context = board_api
              csrf = context["csrfToken"]
              user_id = context["userId"]
              payload = _command_payload(user_id)
              payload["expectedDocumentSha256"] = _snapshot_payload()["documentSha256"]
              assert client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=payload,
                  headers={"x-csrf-token": csrf},
              ).status_code == 200

              changed = json.loads(json.dumps(payload))
              changed["commands"][0]["command"]["title"] = "Different payload"
              rejected = client.post(
                  f"/api/v1/boards/{DOCUMENT_ID}/commands",
                  json=changed,
                  headers={"x-csrf-token": csrf},
              )
              assert rejected.status_code == 409
          '''
          api_tests.write_text(text.replace(marker, additions + marker, 1), encoding="utf-8")
          PY
      - name: Refresh ordered contract tests
        run: |
          cat > tests/test_board_command_ordering.py <<'EOF'
          from __future__ import annotations

          import json
          from pathlib import Path

          import pytest
          from pydantic import ValidationError as PydanticValidationError

          from tutor_assistant_web.modules.boards.contracts import (
              BoardCommandEnvelopeInput,
              envelope_actor_ids,
              envelope_base_revisions,
              envelope_commands,
              envelope_lamport_range,
          )

          CONTRACT = Path(__file__).parents[1] / "schemas" / "board" / "v1" / "fixtures"


          def payload() -> dict:
              return json.loads((CONTRACT / "board-command-envelope.json").read_text())


          def test_ordered_envelope_exposes_commands_and_order_metadata() -> None:
              envelope = BoardCommandEnvelopeInput.model_validate(payload()).root
              assert len(envelope_commands(envelope)) == 2
              assert envelope_actor_ids(envelope) == ["actor:tutor-01", "actor:tutor-01"]
              assert envelope_base_revisions(envelope) == [7, 7]
              assert envelope_lamport_range(envelope) == (8, 9)


          @pytest.mark.parametrize("lamports", ([8, 8], [9, 8], [0, 1]))
          def test_ordered_envelope_rejects_invalid_lamport(lamports: list[int]) -> None:
              value = payload()
              for item, lamport in zip(value["commands"], lamports, strict=True):
                  item["order"]["lamport"] = lamport
              with pytest.raises(PydanticValidationError):
                  BoardCommandEnvelopeInput.model_validate(value)


          def test_ordered_envelope_rejects_future_base_revision() -> None:
              value = payload()
              value["commands"][0]["order"]["baseRevisionAtCreation"] = 9
              with pytest.raises(PydanticValidationError):
                  BoardCommandEnvelopeInput.model_validate(value)


          @pytest.mark.parametrize("version", ["1.0", "1.2"])
          def test_legacy_envelopes_remain_readable(version: str) -> None:
              value = payload()
              value["schemaVersion"] = version
              value["commands"] = [item["command"] for item in value["commands"]]
              envelope = BoardCommandEnvelopeInput.model_validate(value).root
              assert envelope.schema_version == version
              assert envelope_lamport_range(envelope) is None


          def test_unknown_envelope_version_fails_closed() -> None:
              value = payload()
              value["schemaVersion"] = "2.0"
              with pytest.raises(PydanticValidationError):
                  BoardCommandEnvelopeInput.model_validate(value)


          def test_unknown_transport_field_fails_closed() -> None:
              value = payload()
              value["unexpected"] = True
              with pytest.raises(PydanticValidationError):
                  BoardCommandEnvelopeInput.model_validate(value)
          EOF
      - run: uv run ruff format src/tutor_assistant_web/modules/boards tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - run: uv run ruff check --fix src/tutor_assistant_web/modules/boards tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - run: uv run ruff check src/tutor_assistant_web/modules/boards tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - run: make board-contract-check
      - run: uv run pytest tests/test_board_contracts.py tests/test_board_command_ordering.py tests/test_board_api.py
      - name: Commit implementation
        run: |
          rm -f .github/workflows/automation-p0-v13-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(boards): finalize ordered envelope persistence"
          git push origin HEAD:feature/p0-ordered-envelope-v13
