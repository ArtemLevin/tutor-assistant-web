name: B2 security patch

on:
  push:
    branches:
      - agent/b2-guest-invitations

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b2-guest-invitations
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Apply security patch
        run: |
          python tools/b2_security_patch.py || true
          python tools/b2_security_observability_fix.py
          uvx ruff format src/tutor_assistant_web/modules/boards/guest_access.py src/tutor_assistant_web/bootstrap/app_factory.py src/tutor_assistant_web/shared/middleware.py src/tutor_assistant_web/observability.py
          rm tools/b2_security_patch.py tools/b2_security_observability_fix.py .github/workflows/b2-security-patch.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'security: harden standalone guest access surfaces'
          git push origin HEAD:agent/b2-guest-invitations
